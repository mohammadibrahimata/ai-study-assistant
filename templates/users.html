<!DOCTYPE html>
<html>
<head>
    <title>AI Study Assistant</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>All Users</h1>

    <table border="1">
        <tr>
            <th>Username</th>
            <th>Password</th>
        </tr>

        {% for user in users %}
        <tr>
            <td>{{ user[0] }}</td>
            <td>{{ user[1] }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
